# CI is where upstream code is allowed to run: Omarchy's renderer (for parity)
# and libcosmic (to parse our COSMIC theme files). Neither ever runs on a
# desktop. Merge an upstream sync only when every job is green.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: pip install --quiet shellcheck-py
      - name: shellcheck
        run: shellcheck -x tools/*.sh tests/*.sh image/build.sh src/bin/tos src/bin/tos-setup src/bin/tos-doctor src/bin/tos-crash-watch src/bin/tos-agent src/libexec/tos-helper src/libexec/tos-flatpak-provision image/nvidia/build-kmod.sh image/nvidia/install.sh image/branding.sh src/share/profile.d/tegendo-welcome.sh image/signing.sh
      - name: python
        run: python3 -m py_compile src/bin/tos-theme src/bin/tos-mcp src/bin/tos-friday src/lib/tos_redact.py src/lib/friday/*.py
      - name: XML (polkit policy, firewalld zone)
        run: python3 -c 'import sys, xml.dom.minidom as m; [m.parse(f) for f in sys.argv[1:]]' src/polkit/*.policy image/system/*.xml
      - name: packages.txt is official-repo names only
        run: |
          ! sed -e 's/#.*//' image/packages.txt | grep -vE '^[[:space:]]*$' | grep -vE '^[A-Za-z0-9@._+-]+[[:space:]]*$'

  friday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Official MCP SDK (test client only; tos-mcp itself has no dependencies)
        run: pip install --quiet mcp
      - name: tos-mcp tests, incl. a real MCP client over stdio
        run: python3 -m unittest tests/test_tos_mcp.py -v
      - name: Root-helper refusal tests (stop before changing anything)
        run: sudo python3 -m unittest tests.test_tos_mcp.HelperTests -v
      - name: Friday (backends, markup, fallback; no display or account needed)
        run: python3 -m unittest tests/test_friday.py -v
      - name: Flatpak provisioning (image/flatpaks.txt, against a stub flatpak)
        run: tests/flatpak-provision.sh

  signing:
    # End to end: CI's signing script + the image's policy, checked by the same
    # library bootc uses. Throwaway key; no secrets.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Signed images pass, unsigned and wrong-key images don't
        run: tests/signing-policy.sh

  theme-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch Omarchy at the pinned commit
        run: |
          commit=$(awk -F' = ' '$1=="commit"{print $2}' vendor/omarchy/UPSTREAM.lock)
          git clone --quiet --filter=blob:none https://github.com/basecamp/omarchy.git "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" checkout --quiet "$commit"
      - name: Vendored data matches the pinned commit
        run: |
          src="$RUNNER_TEMP/omarchy"
          diff -r "$src/themes" vendor/omarchy/themes
          diff -r "$src/default/themed" vendor/omarchy/themed
          diff "$src/default/agents/skills/diagnose-crash/SKILL.md" vendor/omarchy/skills/diagnose-crash/SKILL.md
      - name: Renderer parity with upstream
        run: OMARCHY_SRC="$RUNNER_TEMP/omarchy" tests/theme-parity.sh

  cosmic-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate COSMIC theme files
        run: |
          mkdir -p "$RUNNER_TEMP/ron"
          for t in vendor/omarchy/themes/*/ src/share/themes/*/; do
            TOS_SHARE=src/share python3 src/bin/tos-theme cosmic-ron --colors "$t/colors.toml" \
              > "$RUNNER_TEMP/ron/$(basename "$t").ron"
          done
      - name: Parse with libcosmic
        run: cargo run --quiet --manifest-path tests/cosmic-ron-check/Cargo.toml -- "$RUNNER_TEMP"/ron/*.ron
