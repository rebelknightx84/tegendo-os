# Builds the tegendo-os bootc image.
#   pull requests: build only (proves the image builds and passes bootc lint)
#   main, daily schedule, manual: build, push to ghcr.io, sign (keyless, Sigstore)
# The daily rebuild picks up Fedora's security updates for the base image.
name: image

on:
  pull_request:
    paths: [image/**, src/**, vendor/**, NOTICE, .github/workflows/image.yml]
  push:
    branches: [main]
    paths: [image/**, src/**, vendor/**, NOTICE, .github/workflows/image.yml]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  FEDORA_VERSION: "45"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write     # push to ghcr.io
      id-token: write     # keyless signing (Sigstore OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (desktop images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: |
          podman build -f image/Containerfile \
            --build-arg FEDORA_VERSION="$FEDORA_VERSION" \
            -t localhost/tegendo-os:ci .

      - name: Image name
        if: github.event_name != 'pull_request'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tegendo-os" >> "$GITHUB_ENV"

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.docker
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin --authfile ~/.docker/config.json
          stamp=$(date -u +%Y%m%d)
          for tag in "$FEDORA_VERSION" "$FEDORA_VERSION-$stamp" latest "sha-${GITHUB_SHA::7}"; do
            podman push --authfile ~/.docker/config.json --digestfile digest localhost/tegendo-os:ci "$IMAGE:$tag"
          done
          echo "DIGEST=$(cat digest)" >> "$GITHUB_ENV"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign (keyless, recorded in the Rekor transparency log)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### tegendo-os image"
            echo "- \`$IMAGE:$FEDORA_VERSION\` → \`$DIGEST\`"
            echo "- Switch a Fedora COSMIC Atomic machine: \`sudo bootc switch $IMAGE:$FEDORA_VERSION\`"
            echo "- Verify: \`cosign verify $IMAGE@$DIGEST --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
