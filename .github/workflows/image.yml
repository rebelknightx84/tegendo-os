# Builds the tegendo-os bootc image.
#   pull requests: build only (proves the image builds and passes bootc lint)
#   main, daily schedule, manual: build, rechunk, push to ghcr.io, sign
#     - with the cosign key (COSIGN_PRIVATE_KEY): what machines enforce
#     - keyless (GitHub OIDC, Rekor): public provenance anyone can check
# The daily rebuild picks up Fedora's security updates for the base image.
name: image

on:
  pull_request:
    paths: [image/**, src/**, vendor/**, NOTICE, tools/ci-sign.sh, .github/workflows/image.yml]
  push:
    branches: [main]
    paths: [image/**, src/**, vendor/**, NOTICE, tools/ci-sign.sh, .github/workflows/image.yml]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  FEDORA_VERSION: "45"

jobs:
  build:
    # 26.04 for its newer podman, which the rechunk step needs (as ublue's image-template).
    runs-on: ubuntu-26.04
    # A normal build takes ~15 min; fail fast instead of hanging for 6 hours.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write     # push to ghcr.io
      id-token: write     # keyless signing (Sigstore OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (desktop images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # NVIDIA modules are signed with your Machine Owner Key (secret
      # MOK_PRIVATE_KEY, created by tools/make-mok-key.sh). Published builds
      # require it; pull-request builds never see it and use a throwaway key.
      - name: Build
        env:
          MOK_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.MOK_PRIVATE_KEY || '' }}
          REQUIRE_MOK_KEY: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: |
          secret_args=()
          if [[ -n "$MOK_PRIVATE_KEY" ]]; then
            keyfile=$(umask 077; mktemp -p "$RUNNER_TEMP")
            trap 'shred -u "$keyfile"' EXIT
            printf '%s\n' "$MOK_PRIVATE_KEY" >"$keyfile"
            secret_args=(--secret "id=mok_key,src=$keyfile")
          fi
          podman build -f image/Containerfile \
            --build-arg FEDORA_VERSION="$FEDORA_VERSION" \
            --build-arg REQUIRE_MOK_KEY="$REQUIRE_MOK_KEY" \
            "${secret_args[@]}" \
            -t localhost/tegendo-os:ci .
          # The private key must not be anywhere in the finished image.
          if [[ -n "$MOK_PRIVATE_KEY" ]]; then
            sed -n 2p "$keyfile" | podman run --rm -i localhost/tegendo-os:ci \
              sh -c 'needle=$(cat); ! grep -rqsF -- "$needle" /usr /etc /var' ||
              { echo "MOK private key material found in the image"; exit 1; }
          fi
          podman run --rm localhost/tegendo-os:ci test ! -e /etc/pki/akmods/private

      # Split the image into ~100 content-based layers so updates download only
      # what changed (Universal Blue's image-template recipe). Runs on PRs too, to test it.
      - name: Rechunk
        run: |
          graphroot=$(podman info --format '{{ .Store.GraphRoot }}')
          podman run --rm --pull=never --privileged \
            --mount=type=image,src=localhost/tegendo-os:ci,target=/rpm-ostree \
            --mount=type=bind,src="$graphroot",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            localhost/tegendo-os:ci \
            compose build-chunked-oci --max-layers 127 --format-version=2 --bootc \
            --rootfs /rpm-ostree \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]localhost/tegendo-os:ci"
          echo "layers: $(podman inspect localhost/tegendo-os:ci --format '{{ len .RootFS.Layers }}')"
          podman run --rm localhost/tegendo-os:ci bootc container lint

      - name: Image name
        if: github.event_name != 'pull_request'
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tegendo-os" >> "$GITHUB_ENV"

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.docker
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin --authfile ~/.docker/config.json
          stamp=$(date -u +%Y%m%d)
          # Push once, then point every other tag at that exact manifest. Pushing
          # per tag can produce different digests (the first push re-encodes), and
          # only the signed digest passes the machines' policy.
          podman push --authfile ~/.docker/config.json --digestfile digest localhost/tegendo-os:ci "$IMAGE:$FEDORA_VERSION"
          for tag in "$FEDORA_VERSION-$stamp" latest "sha-${GITHUB_SHA::7}"; do
            skopeo copy --authfile ~/.docker/config.json --preserve-digests \
              "docker://$IMAGE@$(cat digest)" "docker://$IMAGE:$tag"
          done
          echo "DIGEST=$(cat digest)" >> "$GITHUB_ENV"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # What machines enforce (policy.json → image/signing/cosign.pub).
      # Published builds refuse to finish without it.
      - name: Sign with the cosign key
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          [[ -n "$COSIGN_PRIVATE_KEY" ]] ||
            { echo "COSIGN_PRIVATE_KEY secret is missing (tools/make-cosign-key.sh)"; exit 1; }
          tools/ci-sign.sh "$IMAGE@$DIGEST"
          cosign verify --key image/signing/cosign.pub "$IMAGE@$DIGEST" >/dev/null
          echo "verified against image/signing/cosign.pub"

      - name: Sign keyless (public provenance, Rekor transparency log)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # What a machine does on update: every tag must be the signed digest and
      # pass `cosign verify` with the key the image ships.
      - name: Every tag is signed
        if: github.event_name != 'pull_request'
        run: |
          for tag in "$FEDORA_VERSION" "$FEDORA_VERSION-$STAMP" latest "sha-${GITHUB_SHA::7}"; do
            got=$(skopeo inspect --authfile ~/.docker/config.json --format '{{ .Digest }}' "docker://$IMAGE:$tag")
            [[ $got == "$DIGEST" ]] || { echo "::error::$tag -> $got, signed digest is $DIGEST"; exit 1; }
            cosign verify --key image/signing/cosign.pub "$IMAGE:$tag" >/dev/null
            echo "$tag -> $DIGEST: signed"
          done

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### tegendo-os image"
            echo "- \`$IMAGE:$FEDORA_VERSION\` → \`$DIGEST\`"
            echo "- NVIDIA driver: \`$(podman run --rm localhost/tegendo-os:ci sh -c 'rpm -q --qf "%{VERSION} " xorg-x11-drv-nvidia; cat /usr/share/tegendo-os/mok/SIGNED_WITH' 2>/dev/null | tr '\n' ' ')\`"
            echo "- Switch a Fedora COSMIC Atomic machine: \`sudo bootc switch --enforce-container-sigpolicy $IMAGE:$FEDORA_VERSION\` (already on it: \`tos signing enforce\`)"
            echo "- Verify (key): \`cosign verify --key image/signing/cosign.pub $IMAGE@$DIGEST\`"
            echo "- Verify: \`cosign verify $IMAGE@$DIGEST --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
