---
- name: Install firewall and Tailscale
  become: true
  community.general.pacman:
    name: [ufw, tailscale]
    state: present

- name: Firewall policy
  when: tos_firewall
  become: true
  block:
    - name: Default deny incoming
      community.general.ufw:
        direction: incoming
        default: deny

    - name: Default allow outgoing
      community.general.ufw:
        direction: outgoing
        default: allow

    - name: Allow everything arriving over Tailscale
      when: tos_firewall_allow_tailscale
      community.general.ufw:
        rule: allow
        direction: in
        interface: tailscale0
        comment: tegendo-os tailnet

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Start ufw at boot
      ansible.builtin.systemd_service:
        name: ufw
        enabled: true
        state: started

- name: Check whether OpenSSH is installed
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d
  register: tos_sshd_dir

- name: Harden sshd (does not enable the service)
  when: tos_harden_sshd and tos_sshd_dir.stat.exists
  become: true
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-tegendo-os.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by tegendo-os (ansible/roles/security)
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
    validate: /usr/bin/sshd -t -f %s

- name: Report Secure Boot state
  ansible.builtin.command: bootctl status --no-pager
  register: tos_bootctl
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note when Secure Boot is off
  ansible.builtin.debug:
    msg: >-
      Secure Boot is not enabled. Optional hardening: sbctl with your own keys
      (see docs/SECURITY.md). Not automated, because a mistake here can stop
      the machine booting, especially with NVIDIA kernel modules.
  when: "'Secure Boot: enabled' not in tos_bootctl.stdout"
