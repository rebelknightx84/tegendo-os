---
- name: Install COSMIC and the terminal
  become: true
  community.general.pacman:
    name:
      - cosmic-session
      - cosmic-settings
      - cosmic-files
      - cosmic-term
      - xdg-desktop-portal-cosmic
      - "{{ tos_terminal }}"
    state: present

- name: Ghostty config directory
  when: tos_terminal == 'ghostty'
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty"
    state: directory
    mode: "0755"

- name: Ghostty follows the active theme
  when: tos_terminal == 'ghostty'
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty/config"
    create: true
    mode: "0644"
    marker: "# {mark} tegendo-os managed"
    block: |
      font-family = {{ tos_font }}
      window-padding-x = 12
      window-padding-y = 12
      # Colors come from the active tegendo-os theme (tos theme set ...).
      config-file = ?{{ ansible_facts['env']['HOME'] }}/.local/state/tegendo-os/current/theme/ghostty.conf

- name: Btop config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/btop"
    state: directory
    mode: "0755"

- name: Btop follows the active theme
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/btop/btop.conf"
    create: true
    mode: "0644"
    regexp: '^color_theme\s*='
    line: 'color_theme = "{{ ansible_facts["env"]["HOME"] }}/.local/state/tegendo-os/current/theme/btop.theme"'
