---
- name: Install base packages
  become: true
  community.general.pacman:
    name: "{{ tos_base_packages + tos_extra_packages }}"
    state: present

- name: Check Snapper root config
  ansible.builtin.command:
    argv: [snapper, -c, root, list, --columns, number]
  register: tos_snapper
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Warn when Snapper has no root config
  ansible.builtin.debug:
    msg: >-
      WARNING: no Snapper 'root' config. Pre-change snapshots (snap-pac, tos doctor)
      won't work. CachyOS sets this up when you pick Btrfs + Snapper in the
      installer; otherwise run: sudo snapper -c root create-config /
  when: tos_snapper.rc != 0

- name: Install tegendo-os tools
  become: true
  ansible.builtin.copy:
    src: "{{ tos_repo_dir }}/src/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [tos, tos-theme, tos-doctor, tos-agent, tos-crash-watch]

- name: Create shared data directory
  become: true
  ansible.builtin.file:
    path: /usr/share/tegendo-os
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record version
  become: true
  ansible.builtin.copy:
    content: "{{ tos_version }}\n"
    dest: /usr/share/tegendo-os/VERSION
    owner: root
    group: root
    mode: "0644"
