---
tos_base_packages:
  # core tooling
  - git
  - base-devel
  - paru                 # AUR helper (CachyOS repo); shows PKGBUILD diffs
  - pacman-contrib       # checkupdates (used by tos doctor)
  - python
  - jq
  - pciutils           # lspci (GPU detection, tos doctor)
  - libnotify            # notify-send for crash toasts
  # snapshots & recovery
  - snapper
  - snap-pac             # snapshot before/after every pacman transaction
  # crash diagnosis
  - gdb
  - debuginfod
  # everyday CLI (Omarchy picks)
  - btop
  - fzf
  - eza
  - bat
  - ripgrep
  - fd
  - zoxide
  - starship
  # containers (Ubuntu-native tools without leaving CachyOS)
  - distrobox
  - podman
  # fonts
  - ttf-jetbrains-mono-nerd
  - noto-fonts
  - noto-fonts-emoji
