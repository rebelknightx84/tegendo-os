---
- name: Agent config
  ansible.builtin.template:
    src: agent.conf.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/tegendo-os/agent.conf"
    mode: "0600"

- name: Skill directories for agents
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [.claude/skills, .agents/skills]

- name: Link skills where agents look for them
  ansible.builtin.file:
    src: "/usr/share/tegendo-os/skills/{{ item.1 }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/{{ item.0 }}/{{ item.1 }}"
    state: link
    force: true
  loop: "{{ ['.claude/skills', '.agents/skills'] | product(['tegendo-os', 'diagnose-crash']) | list }}"

- name: Local Ollama (opt-in)
  when: tos_ollama_local
  become: true
  block:
    - name: Install ollama with CUDA
      community.general.pacman:
        name: ollama-cuda
        state: present

    - name: Start ollama (listens on localhost only by default)
      ansible.builtin.systemd_service:
        name: ollama
        enabled: true
        state: started

- name: Crash watcher
  when: tos_crash_watch
  block:
    - name: User unit directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Install crash watcher unit
      ansible.builtin.copy:
        src: "{{ tos_repo_dir }}/src/systemd/tos-crash-watch.service"
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/tos-crash-watch.service"
        mode: "0644"

    - name: Enable crash watcher
      ansible.builtin.systemd_service:
        name: tos-crash-watch
        scope: user
        enabled: true
        state: started
        daemon_reload: true

- name: Friday connector (tos-mcp)
  when: tos_friday
  block:
    - name: Install dialog tool for approvals
      become: true
      community.general.pacman:
        name: [zenity, polkit, jq]
        state: present

    - name: Private library directory
      become: true
      ansible.builtin.file:
        path: /usr/local/lib/tegendo-os
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install tos-mcp, its redaction library and the root helper
      become: true
      ansible.builtin.copy:
        src: "{{ tos_repo_dir }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: src/bin/tos-mcp, dest: /usr/local/bin/tos-mcp, mode: "0755" }
        - { src: src/lib/tos_redact.py, dest: /usr/local/lib/tegendo-os/tos_redact.py, mode: "0644" }
        - { src: src/libexec/tos-helper, dest: /usr/local/lib/tegendo-os/tos-helper, mode: "0755" }
        - { src: src/polkit/org.tegendo.os.friday.policy,
            dest: /usr/share/polkit-1/actions/org.tegendo.os.friday.policy, mode: "0644" }
      loop_control:
        label: "{{ item.dest }}"

    - name: Check whether Claude Code is installed
      ansible.builtin.command: which claude
      register: tos_claude_cli
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check whether tos-mcp is registered with Claude Code
      when: tos_claude_cli.rc == 0
      ansible.builtin.command:
        argv: [claude, mcp, get, tegendo-os]
      register: tos_mcp_registered
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Register tos-mcp with Claude Code (user scope)
      when:
        - tos_claude_cli.rc == 0
        - tos_mcp_registered.rc != 0
      ansible.builtin.command:
        argv: [claude, mcp, add, --scope, user, tegendo-os, --, /usr/local/bin/tos-mcp]
      register: tos_mcp_add
      changed_when: tos_mcp_add.rc == 0
      failed_when: false

    - name: Report Friday connector
      ansible.builtin.debug:
        msg: >-
          tos-mcp installed ({{ 'registered with Claude Code' if tos_claude_cli.rc == 0
          else 'install Claude Code, then run: claude mcp add --scope user tegendo-os -- tos-mcp' }}).
          Tools: tos-mcp --list-tools · Activity: tos friday-log

- name: Remind about agent CLI
  ansible.builtin.debug:
    msg: >-
      Agent set to '{{ tos_agent }}'. If its CLI isn't installed yet, see
      docs/AI.md. Try it with: tos doctor --collect-only (writes a redacted
      report without sending anything).
