---
# Report-first: CachyOS's chwd owns NVIDIA driver selection. This role checks
# what chwd set up and only touches the bootloader if you opt in.

- name: Detect NVIDIA GPU
  ansible.builtin.shell: set -o pipefail && lspci -nn | grep -iE 'vga|3d' | grep -i nvidia
  args:
    executable: /bin/bash
  register: tos_nvidia_gpu
  changed_when: false
  failed_when: false
  check_mode: false

- name: NVIDIA checks
  when: tos_nvidia_gpu.rc == 0
  block:
    - name: Check the NVIDIA kernel module is loaded
      ansible.builtin.command: grep -q '^nvidia_drm ' /proc/modules
      register: tos_nvidia_loaded
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the running kernel command line
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: tos_cmdline

    - name: Read Limine defaults
      ansible.builtin.slurp:
        src: /etc/default/limine
      register: tos_limine_defaults
      failed_when: false

    - name: Summarize NVIDIA state
      ansible.builtin.set_fact:
        tos_running_modeset: "{{ 'nvidia_drm.modeset=1' in (tos_cmdline.content | b64decode) }}"
        tos_limine_has_modeset: >-
          {{ (tos_limine_defaults.content | default('') | b64decode) is search('nvidia_drm\.modeset=1') }}

    - name: Report
      ansible.builtin.debug:
        msg:
          - "GPU: {{ tos_nvidia_gpu.stdout | trim }}"
          - "nvidia_drm loaded: {{ tos_nvidia_loaded.rc == 0 }}"
          - "running kernel has nvidia_drm.modeset=1: {{ tos_running_modeset }}"
          - "/etc/default/limine sets it (covers LTS entries too): {{ tos_limine_has_modeset }}"
          - >-
            {{ 'OK' if (tos_running_modeset and tos_limine_has_modeset)
               else 'Set tos_fix_limine_cmdline: true to fix, or check /etc/default/limine by hand.' }}

    - name: Fix Limine command line (opt-in)
      when:
        - tos_fix_limine_cmdline
        - tos_limine_defaults.content is defined
        - not tos_limine_has_modeset
      become: true
      block:
        - name: Snapshot before touching the bootloader
          ansible.builtin.command:
            argv: [snapper, -c, root, create, -d, "pre tegendo-os: limine nvidia cmdline"]
          changed_when: true

        - name: Append NVIDIA parameters to KERNEL_CMDLINE[default]
          ansible.builtin.replace:
            path: /etc/default/limine
            regexp: '^(KERNEL_CMDLINE\[default\]\+?=")(.*)(")$'
            replace: '\1\2 nvidia_drm.modeset=1 nvidia_drm.fbdev=1\3'
          notify: Regenerate Limine entries

  rescue:
    - name: NVIDIA check could not complete
      ansible.builtin.debug:
        msg: "NVIDIA checks hit an error and were skipped; nothing was changed."
